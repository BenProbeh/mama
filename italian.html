<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>מאמא מיה – איטלקי</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="flower-rain" class="emoji-rain flower-rain" aria-hidden="true"></div>
  <div id="emoji-rain" class="emoji-rain" aria-hidden="true"></div>

  <div class="page-wrap">
    <main class="card">
      <h1 class="page-title-italian">מאמא מיה איזו בחירה!</h1>
      <p class="subtitle">המסעדות האיטלקיות לבחירה הן:</p>

      <ul class="restaurant-list">
        <li>
          <button type="button" class="restaurant-btn" data-name="Rustico Rothschild">
            <span>Rustico Rothschild</span>
            <span class="rating">⭐ 4.5</span>
          </button>
        </li>
        <li>
          <button type="button" class="restaurant-btn" data-name="Amore Mio">
            <span>Amore Mio</span>
            <span class="rating">⭐ 4.5</span>
          </button>
        </li>
        <li>
          <button type="button" class="restaurant-btn" data-name="Magazzino">
            <span>Magazzino</span>
            <span class="rating">⭐ 4.3</span>
          </button>
        </li>
      </ul>
    </main>
  </div>

  <audio id="cuisine-audio" class="hidden-audio" preload="auto" playsinline></audio>

  <script src="js/audio-config.js?v=6"></script>
  <script src="js/emoji-rain.js?v=6"></script>
  <script src="js/click-burst.js?v=6"></script>
  <script src="js/booking.js?v=6"></script>
  <script src="js/back-button.js"></script>
  <script>
    resumeCuisineAudio('italian');
    startFlowerRain('flower-rain', 24);
    startEmojiRain('emoji-rain', ['🍕', '🍕', '🍕', '🧀', '🍕'], 35);

    document.querySelectorAll('.restaurant-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        saveRestaurant('איטלקי', btn.dataset.name);
        window.location.href = 'time.html';
      });
    });
  </script>
</body>
</html>
