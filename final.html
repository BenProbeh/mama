<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>נתראה ברביעי!</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="flower-rain" class="emoji-rain flower-rain" aria-hidden="true"></div>

  <div class="page-wrap">
    <main class="card">
      <p class="final-message">נתראה ברביעי בערב תהיי מוכנה</p>
      <p class="final-time" id="display-time">--:--</p>
      <div class="heart-deco">💜</div>
    </main>
  </div>

  <script src="js/emoji-rain.js"></script>
  <script src="js/click-burst.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/back-button.js"></script>
  <script>startFlowerRain('flower-rain', 32);</script>
  <script>
    const booking = getBooking();
    const el = document.getElementById('display-time');
    if (booking.pickupTime) {
      el.textContent = booking.pickupTime;
    } else {
      el.textContent = 'לא נבחרה שעה';
    }
  </script>
</body>
</html>
