<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>מעקב הזמנות – אדמין</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <main class="card admin-table-wrap">
      <h1 class="main-title admin-title">מעקב אחרי הבחירות של קסניה</h1>
      <p class="subtitle">נתונים מהאתר באוויר (מובייל + מחשב)</p>
      <p class="subtitle admin-hint" id="admin-hint" hidden></p>

      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>מטבח</th>
            <th>מסעדה</th>
            <th>שעת איסוף</th>
            <th>תאריך</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="5">טוען...</td></tr>
        </tbody>
      </table>

      <p class="subtitle" id="storage-status">בודק חיבור...</p>
      <button type="button" class="confirm-btn refresh-btn" id="refresh-btn">רענון</button>
    </main>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-db.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/back-button.js"></script>
  <script>
    function updateStorageStatus(count) {
      const el = document.getElementById('storage-status');
      if (typeof isSupabaseConfigured === 'function' && isSupabaseConfigured()) {
        el.textContent = 'שמירה פעילה (Supabase) · ' + count + ' הזמנות';
        el.style.color = '#2e7d32';
        return;
      }
      el.textContent = 'Supabase לא מוגדר – פתח SETUP-SUPABASE.md והדבק מפתחות ב-js/supabase-config.js';
      el.style.color = '#b42318';
    }

    async function loadBookings() {
      const tbody = document.getElementById('bookings-body');
      const hint = document.getElementById('admin-hint');

      if (!isSupabaseConfigured()) {
        hint.hidden = false;
        hint.innerHTML =
          'כדי לראות נתונים: צור חשבון חינם ב-<a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>, ' +
          'הרץ את ה-SQL מ-<strong>SETUP-SUPABASE.md</strong>, והדבק URL + anon key ב-<strong>js/supabase-config.js</strong> → git push.';
        tbody.innerHTML = '<tr><td colspan="5">ממתין להגדרת Supabase</td></tr>';
        updateStorageStatus(0);
        return;
      }

      hint.hidden = true;

      try {
        const list = await loadAllBookings();
        updateStorageStatus(list.length);

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5">עדיין אין הזמנות – שלחי לקסניה את הקישור</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(function (b, i) {
          const date = new Date(b.createdAt).toLocaleString('he-IL');
          return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + b.cuisine + '</td>' +
            '<td>' + b.restaurant + '</td>' +
            '<td>' + b.pickupTime + '</td>' +
            '<td>' + date + '</td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        hint.hidden = false;
        hint.textContent = 'שגיאה: ' + (e.message || e) + ' – בדוק שהטבלה bookings נוצרה ב-Supabase';
        tbody.innerHTML = '<tr><td colspan="5">שגיאת טעינה</td></tr>';
        updateStorageStatus(0);
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadBookings);
    loadBookings();
  </script>
</body>
</html>
