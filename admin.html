<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>מעקב הזמנות – אדמין</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <main class="card admin-table-wrap">
      <h1 class="main-title admin-title">מעקב אחרי הבחירות של קסניה</h1>
      <p class="subtitle">כל מה שנשמר בשרת מופיע כאן (לא הקובץ data במחשב)</p>
      <p class="subtitle admin-hint" id="admin-hint" hidden></p>

      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>מטבח</th>
            <th>מסעדה</th>
            <th>שעת איסוף</th>
            <th>תאריך</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="5">טוען...</td></tr>
        </tbody>
      </table>

      <p class="subtitle" id="storage-status">בודק חיבור לשרת...</p>
      <button type="button" class="confirm-btn refresh-btn" id="refresh-btn">רענון</button>
    </main>
  </div>

  <script src="js/back-button.js"></script>
  <script>
    async function checkStorage() {
      const el = document.getElementById('storage-status');
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.storage && data.storage.ok) {
          el.textContent = 'שמירה בענן פעילה (' + data.storage.type + ') · ' + data.bookingsCount + ' הזמנות';
          el.style.color = '#2e7d32';
        } else {
          el.textContent = (data.storage && data.storage.message) || 'אין שמירה – הגדר Supabase (SETUP-SUPABASE.md) ב-Vercel';
          el.style.color = '#b42318';
        }
      } catch {
        el.textContent = 'לא נמצא API – ודא שתיקיית api/ עלתה ל-Git ועשית Deploy';
        el.style.color = '#b42318';
      }
    }

    async function loadBookings() {
      const tbody = document.getElementById('bookings-body');
      const hint = document.getElementById('admin-hint');

      await checkStorage();

      try {
        const res = await fetch('/api/bookings');
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.bookings || []);

        if (!res.ok || data.error) {
          hint.hidden = false;
          hint.textContent = data.error || data.storage?.message || 'שגיאה בטעינה – ראה DEPLOY-VERCEL.md';
          tbody.innerHTML = '<tr><td colspan="5">אין גישה למסד נתונים</td></tr>';
          return;
        }

        hint.hidden = true;

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5">עדיין אין הזמנות</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(function (b, i) {
          const date = new Date(b.createdAt).toLocaleString('he-IL');
          return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + b.cuisine + '</td>' +
            '<td>' + b.restaurant + '</td>' +
            '<td>' + b.pickupTime + '</td>' +
            '<td>' + date + '</td>' +
            '</tr>';
        }).join('');
      } catch {
        hint.hidden = false;
        hint.textContent = 'לא ניתן להתחבר ל-API. ודא שהפרויקט ב-Vercel כולל תיקיית api/ ו-Vercel KV.';
        tbody.innerHTML = '<tr><td colspan="5">שגיאת חיבור</td></tr>';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadBookings);
    loadBookings();
  </script>
</body>
</html>
