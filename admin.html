<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>מעקב הזמנות – אדמין</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <main class="card admin-table-wrap">
      <h1 class="main-title admin-title">מעקב אחרי הבחירות של קסניה</h1>
      <p class="subtitle admin-hint" id="admin-hint"></p>

      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>מטבח</th>
            <th>מסעדה</th>
            <th>שעת איסוף</th>
            <th>תאריך</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="5">טוען...</td></tr>
        </tbody>
      </table>

      <p class="subtitle" id="storage-status"></p>
      <a href="connect.html" class="confirm-btn" style="display:inline-block;text-decoration:none;margin:0.25rem;">חיבור שמירה</a>
      <button type="button" class="confirm-btn refresh-btn" id="refresh-btn">רענון</button>
    </main>
  </div>

  <script src="js/storage-config.js?v=6"></script>
  <script src="js/storage-save.js?v=6"></script>
  <script src="js/booking.js?v=6"></script>
  <script src="js/back-button.js"></script>
  <script>
    async function loadBookings() {
      const tbody = document.getElementById('bookings-body');
      const hint = document.getElementById('admin-hint');
      const status = document.getElementById('storage-status');

      if (!hasAnyStorage()) {
        hint.innerHTML = 'אין שמירה באוויר. <a href="connect.html">חיבור חינמי (3 דק)</a>';
        hint.style.color = '#b42318';
        tbody.innerHTML = '<tr><td colspan="5">הדבק מפתחות ב-storage-config.js</td></tr>';
        status.textContent = 'עובד רק עם npm start במחשב עד שמגדירים שמירה';
        status.style.color = '#b42318';
        return;
      }

      try {
        const list = await loadAllBookings();
        hint.textContent = '';
        status.textContent = getActiveStorageName() + ' · ' + list.length + ' הזמנות';
        status.style.color = '#2e7d32';

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5">עדיין אין הזמנות</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(function (b, i) {
          const date = new Date(b.createdAt).toLocaleString('he-IL');
          return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + b.cuisine + '</td>' +
            '<td>' + b.restaurant + '</td>' +
            '<td>' + b.pickupTime + '</td>' +
            '<td>' + date + '</td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        hint.innerHTML =
          'אין שמירה עדיין. <a href="connect.html">לחץ כאן לחיבור (3 דקות)</a>';
        hint.style.color = '#b42318';
        tbody.innerHTML = '<tr><td colspan="5">אין נתונים</td></tr>';
        status.textContent = (e.message || e);
        status.style.color = '#b42318';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadBookings);
    loadBookings();
  </script>
</body>
</html>
