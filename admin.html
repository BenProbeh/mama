<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>מעקב הזמנות – אדמין</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <main class="card admin-table-wrap">
      <h1 class="main-title admin-title">מעקב אחרי הבחירות של קסניה</h1>
      <p class="subtitle admin-hint" id="admin-hint"></p>

      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>מטבח</th>
            <th>מסעדה</th>
            <th>שעת איסוף</th>
            <th>תאריך</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="5">טוען...</td></tr>
        </tbody>
      </table>

      <p class="subtitle" id="storage-status"></p>
      <button type="button" class="confirm-btn refresh-btn" id="refresh-btn">רענון</button>
    </main>
  </div>

  <script src="js/storage-config.js?v=4"></script>
  <script src="js/storage-save.js?v=4"></script>
  <script src="js/booking.js?v=4"></script>
  <script src="js/back-button.js"></script>
  <script>
    function showSetup() {
      document.getElementById('admin-hint').innerHTML =
        'הדבק מפתחות Upstash ב-<strong>js/storage-config.js</strong> → ראה <strong>SETUP-UPSTASH.md</strong>';
      document.getElementById('admin-hint').style.color = '#b42318';
      document.getElementById('bookings-body').innerHTML =
        '<tr><td colspan="5">ממתין להגדרה</td></tr>';
      document.getElementById('storage-status').textContent = '';
    }

    async function loadBookings() {
      const tbody = document.getElementById('bookings-body');
      const hint = document.getElementById('admin-hint');
      const status = document.getElementById('storage-status');

      if (!hasAnyStorage()) {
        showSetup();
        return;
      }

      hint.textContent = '';
      hint.style.color = '';

      try {
        const list = await loadAllBookings();
        const via = isUpstashConfigured() ? 'Upstash' : 'Supabase';
        status.textContent = via + ' פעיל · ' + list.length + ' הזמנות';
        status.style.color = '#2e7d32';

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5">עדיין אין הזמנות</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(function (b, i) {
          const date = new Date(b.createdAt).toLocaleString('he-IL');
          return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + b.cuisine + '</td>' +
            '<td>' + b.restaurant + '</td>' +
            '<td>' + b.pickupTime + '</td>' +
            '<td>' + date + '</td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        hint.textContent = 'שגיאה: ' + (e.message || e);
        hint.style.color = '#b42318';
        tbody.innerHTML = '<tr><td colspan="5">שגיאה</td></tr>';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadBookings);
    loadBookings();
  </script>
</body>
</html>
