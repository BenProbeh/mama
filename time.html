<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>בחירת שעה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="flower-rain" class="emoji-rain flower-rain" aria-hidden="true"></div>

  <div class="page-wrap">
    <main class="card">
      <h2 class="time-title">באיזה שעה לאסוף אותך?</h2>

      <div class="time-picker-wrap">
        <input type="time" id="pickup-time" class="time-input" required>
        <button type="button" class="confirm-btn" id="confirm-time">אישור השעה</button>
      </div>
    </main>
  </div>

  <script src="js/emoji-rain.js?v=6"></script>
  <script src="js/click-burst.js?v=6"></script>
  <script src="js/storage-config.js?v=6"></script>
  <script src="js/storage-save.js?v=6"></script>
  <script src="js/booking.js?v=6"></script>
  <script src="js/back-button.js"></script>
  <script>startFlowerRain('flower-rain', 32);</script>
  <script>
    document.getElementById('confirm-time').addEventListener('click', async function () {
      const input = document.getElementById('pickup-time');
      if (!input.value) {
        alert('בבקשה בחרי שעה');
        return;
      }

      savePickupTime(input.value);

      try {
        await sendBookingToServer();
        sessionStorage.removeItem('saveFailed');
      } catch (e) {
        sessionStorage.setItem('saveFailed', '1');
        console.warn('Save failed:', e);
      }

      window.location.href = 'final.html';
    });
  </script>
</body>
</html>
